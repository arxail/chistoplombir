<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ЧистоПломбир — лукбук</title>
<meta name="description" content="Лукбук молочного десерта «ЧистоПломбир» от команды BrainStorm, кейс ЭкоНивы.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&family=Unbounded:wght@600;700&display=swap">
<style>
:root{--bg:#F6F4EE;--card:#FBFAF6;--ink:#17251D;--tx:#33413A;--mu:#4A564E;--gr:#2F7A4A;--lt:#DDE9DF;--line:#D8DACF;color-scheme:light}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);font:400 17px/1.5 Onest,system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
header{padding-block:22px;border-bottom:1px solid var(--line)}
header .wrap{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
.brand{font:600 15px/1 Onest,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--gr)}
.team{font-size:15px;color:var(--mu)}
.hero{padding-block:48px 56px}
.hero .wrap{display:grid;grid-template-columns:1.05fr .95fr;gap:48px;align-items:center}
.kick{font-size:14px;letter-spacing:.1em;text-transform:uppercase;color:var(--mu);margin-bottom:14px}
h1{font:700 clamp(40px,7vw,84px)/1 Unbounded,Onest,sans-serif;letter-spacing:-.02em;text-wrap:balance}
.lead{font-size:clamp(18px,2.2vw,22px);color:var(--tx);margin-top:20px;max-width:30ch}
.facts{display:flex;gap:12px;flex-wrap:wrap;margin-top:28px}
.facts span{background:var(--lt);color:var(--ink);border-radius:999px;padding:9px 18px;font-weight:500;white-space:nowrap}
.hero img{width:100%;height:auto;aspect-ratio:1220/1280;object-fit:cover;border-radius:24px;background:#fff;display:block}
h2{font:600 clamp(26px,3.4vw,38px)/1.15 Onest,sans-serif;text-wrap:balance;margin-bottom:24px}
section.g{padding-block:24px 64px}
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:20px}
figure{background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
figure img{width:100%;height:auto;object-fit:cover;display:block;aspect-ratio:1/1;max-width:100%}
figcaption{padding:14px 18px 16px;font-size:16px;color:var(--tx)}
figcaption b{display:block;color:var(--ink);font-weight:600;font-size:17px}
.w6{grid-column:span 6}.w4{grid-column:span 4}.w8{grid-column:span 8}
.w8 img{aspect-ratio:16/10}
footer{border-top:1px solid var(--line);padding-block:28px 40px;color:var(--mu);font-size:15px}
footer .wrap{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
footer a{color:var(--gr)}
@media (max-width:820px){.hero .wrap{grid-template-columns:1fr}.w6,.w4,.w8{grid-column:span 12}.w8 img{aspect-ratio:1/1}}
</style>
</head>
<body>
<header><div class="wrap"><span class="brand">ЭкоНива · кейс «Ключ»</span><span class="team">Команда BrainStorm</span></div></header>
<section class="hero"><div class="wrap">
<div>
<p class="kick">Лукбук</p>
<h1>Чисто&shy;Пломбир</h1>
<p class="lead">Молочный десерт с натуральной ванилью в пауче 100 г с закручивающейся крышкой.</p>
<div class="facts"><span>15 г белка</span><span>без добавленного сахара</span><span>90 ₽ на полке</span></div>
</div>
<img src="img/pouch.jpg?v=2" alt="Пауч «ЧистоПломбир» с ванилью">
</div></section>
<section class="g"><div class="wrap">
<h2>Как продукт выглядит в жизни</h2>
<div class="grid">
<figure class="w6"><img src="img/campus.jpg?v=2" alt="Студентка с паучем на ступенях университета" loading="lazy"><figcaption><b>Между парами</b>Пауч можно открыть и закрыть, ложка не нужна</figcaption></figure>
<figure class="w6"><img src="img/lavka.jpg?v=2" alt="Заказ десерта в приложении доставки" loading="lazy"><figcaption><b>Доставка</b>Карточка товара в Яндекс Лавке, 90 ₽</figcaption></figure>
<figure class="w8"><img src="img/stand.jpg?v=2" alt="Стенд ЭкоНивы с дегустацией в университете" loading="lazy"><figcaption><b>Дегустация в вузе</b>Стенд ЭкоНивы, где студенты пробуют десерт</figcaption></figure>
<figure class="w4"><img src="img/shelf.jpg?v=2" alt="Пауч на полке магазина рядом с молоком и творогом" loading="lazy"><figcaption><b>На полке</b>Рядом с молочной продукцией, цена 90 ₽</figcaption></figure>
<figure class="w6"><img src="img/box.jpg?v=2" alt="Крафтовая коробка с паучем и открыткой" loading="lazy"><figcaption><b>Подарочный набор</b>Крафтовая коробка с паучем и открыткой</figcaption></figure>
<figure class="w6"><img src="img/bag.jpg?v=2" alt="Шопер ЭкоНивы с паучем и термобутылкой" loading="lazy"><figcaption><b>Мерч</b>Шопер и термобутылка ЭкоНивы</figcaption></figure>
</div>
</div></section>
<footer><div class="wrap"><span>«ЧистоПломбир» · команда BrainStorm</span><a href="../opros/">Результаты опроса →</a></div></footer>
</body>
</html>
